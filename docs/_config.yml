# Jekyll config for the vexy-mkdocs-tools documentation site.
# Served by GitHub Pages with the Just the Docs remote theme.
title: vexy-mkdocs-tools
description: One command that builds every FontLab/Vexy MkDocs site.
remote_theme: just-the-docs/just-the-docs
url: https://vexyart.github.io
baseurl: /vexy-mkdocs-tools

color_scheme: dark
search_enabled: true

aux_links:
  GitHub: https://github.com/vexyart/vexy-mkdocs-tools
  PyPI: https://pypi.org/project/vexy-mkdocs-tools/

plugins:
  - jekyll-remote-theme

# This is a hand-written Jekyll site, not MkDocs output. Exclude repo scaffolding.
exclude:
  - Gemfile
  - Gemfile.lock
